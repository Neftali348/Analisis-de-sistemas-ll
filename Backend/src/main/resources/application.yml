server:
  port: 8081
  error:
    include-message: always
  servlet:
    session:
      timeout: 15m

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sgq_comida_rapida
    username: postgres
    password: "50577590"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:SGQ-2026-CLAVE-DE-DESARROLLO-CAMBIAR-EN-PRODUCCION-1234567890}
    absolute-expiration-hours: 8
  security:
    inactivity-minutes: 15
    max-failed-attempts: 5
    lock-minutes: 15
  uploads:
    directory: ${UPLOAD_DIR:./data/evidencias}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@sgq.local}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
