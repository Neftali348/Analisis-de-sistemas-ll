<div class="page"><div class="page-head"><div><h1>Reportes</h1><p>Vista previa y exportación según permisos y alcance del usuario.</p></div></div><div *ngIf="error" class="alert alert-error">{{error}}</div><div class="card"><div class="grid grid-4"><div class="field"><label>Reporte *</label><select [(ngModel)]="f.reportType"><option *ngFor="let r of reportTypes" [value]="r">{{label(r)}}</option></select></div><div class="field"><label>Desde *</label><input type="date" [(ngModel)]="f.from"></div><div class="field"><label>Hasta *</label><input type="date" [(ngModel)]="f.to"></div><div class="field"><label>Sucursal</label><select [(ngModel)]="f.branchId"><option [ngValue]="null">Todas</option><option *ngFor="let b of branches" [ngValue]="b.id">{{b.name}}</option></select></div><div class="field"><label>Tipo de caso</label><select [(ngModel)]="f.type"><option [ngValue]="null">Todos</option><option *ngFor="let x of types" [value]="x">{{x}}</option></select></div><div class="field"><label>Estado</label><select [(ngModel)]="f.status"><option [ngValue]="null">Todos</option><option *ngFor="let x of statuses" [value]="x">{{label(x)}}</option></select></div><div class="field"><label>Prioridad</label><select [(ngModel)]="f.priority"><option [ngValue]="null">Todas</option><option *ngFor="let x of priorities" [value]="x">{{x}}</option></select></div><div class="field"><label>Categoría</label><select [(ngModel)]="f.category"><option [ngValue]="null">Todas</option><option *ngFor="let x of categories" [value]="x">{{label(x)}}</option></select></div></div><div class="form-actions"><button class="btn btn-primary" (click)="preview()">Generar vista previa</button><button *ngIf="auth.has('REPORT_EXPORT')" class="btn btn-outline" (click)="export('pdf')">PDF</button><button *ngIf="auth.has('REPORT_EXPORT')" class="btn btn-outline" (click)="export('xlsx')">XLSX</button></div></div>
<div *ngIf="data" class="card"><div class="split"><div><h3 style="margin:0">{{label(data.reportType)}}</h3><span class="muted">Generado por {{data.generatedBy}}</span></div></div><div class="grid grid-4" style="margin-top:16px"><div class="stat" *ngFor="let s of entries(data.summary)"><div class="label">{{label(s[0])}}</div><strong>{{s[1]}}</strong></div></div><div class="table-wrap" style="margin-top:18px" *ngIf="data.rows?.length"><table class="table"><thead><tr><th *ngFor="let k of keys(data.rows[0])">{{label(k)}}</th></tr></thead><tbody><tr *ngFor="let row of data.rows"><td *ngFor="let k of keys(row)">{{row[k]}}</td></tr></tbody></table></div><div *ngIf="!data.rows?.length" class="muted" style="margin-top:16px">No hay datos para el rango seleccionado.</div></div></div>
